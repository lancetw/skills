<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Bible Buddy Web — PROTOTYPE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/syabro/neat-annotations/neat-annotations.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500&family=Noto+Sans+TC:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font-family:'Noto Sans TC', system-ui, sans-serif; display:grid; grid-template-columns: 1fr 420px; height:100vh; }
  #reader { overflow:auto; padding:24px 32px; }
  #chat { border-left:1px solid #8884; display:flex; flex-direction:column; }
  #log { flex:1; overflow:auto; padding:12px; font-size:.9rem; }
  #log .tool { color:#888; font-size:.78rem; font-family:monospace; }
  #log .msg { margin:.5em 0; }
  #log .opts button { display:block; margin:4px 0; text-align:left; }
  form { display:flex; gap:6px; padding:10px; border-top:1px solid #8884; }
  form input { flex:1; padding:8px; }
  .verse { font-size:1.1rem; line-height:2.1; padding:6px 10px; }
  .verse.has-notes { padding-bottom:78px; }
  .verse .n { font-family:monospace; font-size:.7rem; opacity:.6; margin-right:.5em; vertical-align:super; }
  .ann { --ann-font:'Shantell Sans','Noto Sans TC',cursive; cursor:pointer; }
  /* notes that didn't get an arrow (cap per verse / too close / no anchor) become chips under the verse */
  .chips { line-height:1.4; margin-top:2px; }
  .verse.has-notes .chips { margin-top:72px; }          /* below the hanging labels */
  .verse.has-notes:has(.chips) { padding-bottom:8px; }
  .chip { display:inline-block; font-size:.72rem; padding:1px 8px; margin:2px 4px 0 0; border:1px solid var(--c); color:var(--c); border-radius:999px; cursor:pointer; opacity:.85; }
  /* note card: native popover = top layer + light dismiss; positioned next to the clicked span */
  #detail { position:fixed; margin:0; inset:auto; width:min(440px, 90vw); max-height:45vh; overflow:auto; padding:12px 14px; border:1px solid #8886; border-radius:10px; background:Canvas; color:CanvasText; box-shadow:0 10px 30px #0005; font-size:.9rem; line-height:1.6; }
  #detail::backdrop { background:transparent; }
  #detail .hd { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #detail .dot { width:10px; height:10px; border-radius:50%; background:var(--c); }
  #detail .hd small { opacity:.6; }
  #detail .hd button { margin-left:auto; font-size:.8rem; }
  #detail p { margin:.4em 0; }
  #study { display:none; padding:12px; overflow:auto; flex:1; font-size:.9rem; }
  #study blockquote { border-left:3px solid #b8751a; padding-left:10px; opacity:.9; }
  h1 { font-size:1.1rem; margin:0 0 12px; opacity:.7; }
  .tabs { display:flex; gap:8px; padding:8px 12px 0; }
  .tabs button.on { font-weight:700; }
</style>
</head>
<body>
<section id="reader">
  <form id="pf" style="display:flex;gap:6px;margin-bottom:8px"><input id="pref" value="以賽亞書 7:10-17" style="width:14em"><select id="pver"><option value="rcuv">和合本修訂版</option><option value="lcc">呂振中</option><option value="bhs">BHS 希伯來文</option><option value="fhlwh">NT 希臘文</option></select><button>載入</button></form>
  <h1 id="ref">載入中…</h1>
  <div id="verses"></div>
  <div id="detail" popover></div>
</section>
<aside id="chat">
  <div class="tabs"><button class="on" data-tab="log">對話</button><button data-tab="study">研讀報告</button></div>
  <div id="log"></div>
  <div id="study"></div>
  <form id="f"><input id="q" placeholder="例：以賽亞書 7:14 原文分析" autocomplete="off"><button>送出</button></form>
</aside>
<script>
const MAX_ARROWS = 3, MIN_GAP = 9;
const COLOR = { lexical:'amber', history:'blue', misread:'red', crossref:'purple', personal:'green' };
let verses = [], notes = [], studyPath = null;
const DOTC = { amber:'#b8751a', blue:'#3b72c4', green:'#2f8f5b', red:'#c45a38', purple:'#8657c8' };
const $ = s => document.querySelector(s);

// 「以賽亞書 7:10-17」「創世記 1」「Matt 5:17」都吃
async function loadPassage(refStr, version) {
  const m = (refStr || '').match(/^(\S+)\s+(\d+)(?::(\d+)(?:-(\d+))?)?$/);
  const qs = m ? `?book=${encodeURIComponent(m[1])}&chapter=${m[2]}&start=${m[3]||1}&end=${m[4]||m[3]||200}&version=${version||'rcuv'}` : '';
  const r = await (await fetch('/api/passage' + qs)).json();
  if (r.error) { alert(r.error); return; }
  notes = await (await fetch('/api/notes')).json();   // server keeps them unless the passage changed
  verses = r.verses;
  $('#ref').textContent = `${r.reference} · ${r.version}`;
  render();
  await addAuto('/api/auto-notes/refs');        // instant, from bible-buddy references
  $('#ref').textContent += '　⏳ 速讀筆記產生中…';
  await addAuto('/api/auto-notes/quick');       // one cheap model pass, ~20 s
  $('#ref').textContent = `${r.reference} · ${r.version}`;
}
async function addAuto(url) {
  const fresh = await (await fetch(url)).json();
  for (const n of fresh) if (!notes.some(x => x.id === n.id)) notes.push(n);
  render();
}

function render() {
  $('#verses').innerHTML = verses.map(v => {
    const vs = notes.filter(n => n.verse === v.verse && n.anchor).sort((a,b) => a.anchor.start - b.anchor.start);
    let out = '', pos = 0, shown = 0, lastStart = -99;
    const rest = notes.filter(n => n.verse === v.verse && !n.anchor);
    for (const n of vs) {
      // one arrow per ~9 chars and at most 3 per verse, so labels don't pile up; the rest become chips
      if (n.anchor.start < pos || shown >= MAX_ARROWS || n.anchor.start - lastStart < MIN_GAP) { rest.push(n); continue; }
      out += esc(v.text.slice(pos, n.anchor.start));
      out += `<span class="ann ${n.anchor.start === 0 ? 'ann-nw' : 'ann-n'} ann-${COLOR[n.kind]||'amber'}" data-note="${esc(n.label)}" data-id="${n.id}">${esc(v.text.slice(n.anchor.start, n.anchor.end))}</span>`;
      pos = n.anchor.end; shown++; lastStart = n.anchor.start;
    }
    out += esc(v.text.slice(pos));
    const chips = rest.length ? `<div class="chips">${rest.map(n => `<span class="chip" data-id="${n.id}" style="--c:${DOTC[COLOR[n.kind]]}">${esc(n.label)}</span>`).join('')}</div>` : '';
    return `<div class="verse ${shown ? 'has-notes' : ''}" data-verse="${v.verse}"><span class="n">${v.verse}</span>${out}<span class="eol">\u200b</span>${chips}</div>`;
  }).join('');
  demoteWrapped();
}
// Labels hang ~70px under their span, so an arrow on any line but the last would cover the next line.
// After layout, turn those into chips. Re-run on resize since wrapping changes.
function demoteWrapped() {
  for (const vEl of document.querySelectorAll('.verse.has-notes')) {
    const lastTop = vEl.querySelector('.eol').getBoundingClientRect().top;
    for (const a of [...vEl.querySelectorAll('.ann')]) {
      const r = a.getBoundingClientRect();
      if (r.bottom >= lastTop) {                                        // on the last line: keep the arrow
        if (r.left - vEl.getBoundingClientRect().left < 110) a.classList.replace('ann-n', 'ann-nw');  // near left edge: lean right
        continue;
      }
      const n = notes.find(x => x.id === a.dataset.id);
      let chips = vEl.querySelector('.chips');
      if (!chips) { chips = document.createElement('div'); chips.className = 'chips'; vEl.appendChild(chips); }
      chips.insertAdjacentHTML('afterbegin', `<span class="chip" data-id="${n.id}" style="--c:${DOTC[COLOR[n.kind]]}">${esc(n.label)}</span>`);
      a.replaceWith(document.createTextNode(a.textContent));
    }
    if (!vEl.querySelector('.ann')) vEl.classList.remove('has-notes');
  }
}
addEventListener('resize', render);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const AUTHOR = { agent:'agent 研讀', quick:'速讀', refs:'references', user:'我' };
$('#verses').addEventListener('click', e => {
  const a = e.target.closest('[data-id]'); if (!a) return;
  const n = notes.find(x => x.id === a.dataset.id);
  const d = $('#detail');
  d.innerHTML = `<div class="hd"><span class="dot" style="--c:${DOTC[COLOR[n.kind]]}"></span><b>${esc(n.label)}</b><small>${AUTHOR[n.author]||n.author} · ${n.kind}</small><button id="ask">追問</button></div>${marked.parse(n.body || '（沒有內文）')}`;
  d.querySelector('#ask').onclick = () => { d.hidePopover(); $('#q').value = `針對「${n.label}」再深入：`; $('#q').focus(); };
  d.showPopover();
  // below the label (label sits ~70px under the span); flip above if it would overflow
  const r = a.getBoundingClientRect();
  let top = r.bottom + 78;
  if (top + d.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - d.offsetHeight - 8);
  d.style.top = top + 'px';
  d.style.left = Math.max(8, Math.min(r.left, innerWidth - d.offsetWidth - 8)) + 'px';
});

// 手動筆記：反白一節內的文字 → prompt 標籤
document.addEventListener('mouseup', async () => {
  const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
  const q = sel.toString().trim(); if (!q) return;
  const vEl = sel.anchorNode.parentElement.closest('.verse'); if (!vEl) return;
  const v = verses.find(x => x.verse === vEl.dataset.verse);
  const start = v.text.indexOf(q); if (start < 0) return;
  const label = window.prompt(`筆記標籤（≤20 字）：「${q}」`); if (!label) return;
  const note = await (await fetch('/api/notes', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ verse: v.verse, anchor:{start, end:start+q.length}, label: label.slice(0,20), body:'' }) })).json();
  notes.push(note); sel.removeAllRanges(); render();
});

function logLine(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; $('#log').appendChild(d); $('#log').scrollTop = 1e9; return d; }

async function send(text) {
  logLine('msg', `<b>你：</b>${esc(text)}`);
  const cur = logLine('msg', '');
  let buf = '';
  const res = await fetch('/api/chat', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ message:text }) });
  const rd = res.body.getReader(), dec = new TextDecoder(); let rest = '';
  while (true) {
    const { value, done } = await rd.read(); if (done) break;
    rest += dec.decode(value, { stream:true });
    let i; while ((i = rest.indexOf('\n\n')) >= 0) {
      const line = rest.slice(0, i); rest = rest.slice(i + 2);
      if (!line.startsWith('data: ')) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === 'text') { buf += ev.text + '\n'; cur.innerHTML = marked.parse(buf); }
      else if (ev.type === 'tool') { logLine('tool', `⚙ ${esc(ev.name)} ${esc(ev.input)}`); const m = ev.input.match(/file_path[^"]*"([^"]+\.md)"/); if (ev.name === 'Write' && m) studyPath = m[1]; }
      else if (ev.type === 'note') { notes.push(ev.note); render(); }
      else if (ev.type === 'done') { logLine('tool', `✓ ${ev.turns} turns · $${(ev.cost||0).toFixed(2)}${ev.is_error ? ' · ERROR' : ''}`); renderOptions(buf); if (studyPath) loadStudy(); }
      else if (ev.type === 'error') logLine('tool', `✗ ${esc(ev.text)}`);
      $('#log').scrollTop = 1e9;
    }
  }
}
// 「請選擇 (1-N)」→ 按鈕
function renderOptions(text) {
  if (!/請選擇\s*\(1-\d\)/.test(text)) return;
  const opts = [...text.matchAll(/^\s*(\d)[\.、．]\s*(.+)$/gm)].slice(-6);
  if (!opts.length) return;
  const d = logLine('opts', '');
  for (const [, n, t] of opts) { const b = document.createElement('button'); b.textContent = `${n}. ${t.slice(0,60)}`; b.onclick = () => send(n); d.appendChild(b); }
}
async function loadStudy() {
  const md = await (await fetch('/api/study?path=' + encodeURIComponent(studyPath))).text();
  $('#study').innerHTML = `<div class="tool">${esc(studyPath)}</div>` + marked.parse(md);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#log').style.display = b.dataset.tab === 'log' ? '' : 'none';
  $('#study').style.display = b.dataset.tab === 'study' ? 'block' : 'none';
});
$('#f').onsubmit = e => { e.preventDefault(); const t = $('#q').value.trim(); if (!t) return; $('#q').value = ''; send(t); };
$('#pf').onsubmit = e => { e.preventDefault(); loadPassage($('#pref').value.trim(), $('#pver').value); };
loadPassage();
</script>
</body>
</html>
