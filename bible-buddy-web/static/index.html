<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<title>Bible Buddy ELI5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/syabro/neat-annotations/neat-annotations.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@500;600;700&family=Iansui&family=LXGW+WenKai+TC&family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Serif+Hebrew:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slot-text@0.3.4/style.css">
<style>
  /* notebook: ivory paper, red margin rule, serif scripture, handwritten labels. Light by default. */
  :root {
    /* handwriting stack: Shantell Sans covers Latin only, so CJK falls through to Iansui (芫荽), then 霞鶩文楷 */
    --hand: 'Shantell Sans', 'Iansui', 'LXGW WenKai TC', 'Noto Sans Hebrew', cursive;
    /* Hebrew with niqqud/cantillation needs a font that has them; the CJK faces don't, so every stack ends in Noto Hebrew */
    --sans: 'Noto Sans TC', 'Noto Sans Hebrew', system-ui, sans-serif;
    --serif: 'Noto Serif TC', 'Songti TC', 'Noto Serif Hebrew', serif;
    color-scheme: light;
    --paper:#F8F5EC; --paper-2:#F1EDE1; --ink:#2B2A26; --ink-2:#6E6A60; --rule:#DED8C8; --margin:#D9A3A3;
    --pen:#3A5A8C; --card:#FFFDF7; --shadow:0 6px 20px #4a412a22;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:#1E1D1A; --paper-2:#26241F; --ink:#E6E1D6; --ink-2:#A39E92; --rule:#36332C; --margin:#7A4A4A;
    --pen:#8FB0E0; --card:#2A2823; --shadow:0 6px 20px #00000066;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); display:grid; grid-template-columns:1fr var(--chat-w, 420px); grid-template-rows:100vh; height:100vh; }
  /* chat panel: hidden by default, width set by dragging its left edge; both remembered per browser */
  body.chat-hidden { grid-template-columns:1fr 0; } body.chat-hidden #chat { display:none; }
  #gutter { position:absolute; left:-4px; top:0; bottom:0; width:8px; cursor:col-resize; z-index:6; }
  #gutter:hover, #gutter.on { background:var(--pen); opacity:.3; }
  #chatToggle.on { border-color:var(--pen); color:var(--pen); }
  #reader, #chat { min-height:0; }   /* grid items default to min-height:auto and would grow past the row */
  button, input, select { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--pen); color:var(--pen); }
  /* anything disabled says so under the mouse: the chat input while a turn runs, the quick / verify buttons */
  button:disabled, input:disabled { cursor:not-allowed; opacity:.55; } button:disabled:hover { border-color:var(--rule); color:inherit; }
  form#f:has(#q:disabled) { cursor:not-allowed; }
  button.primary { background:var(--pen); color:var(--paper); border-color:var(--pen); }

  /* reader = a notebook page */
  #reader { overflow:auto; padding:0 32px 40px 24px; }
  /* the title bar stays put while the passage scrolls under it */
  /* a solid band edge to edge (negative margins undo the reader's gutters), with a hard rule; no shadow, nothing shows through */
  .top { display:flex; flex-wrap:wrap; row-gap:8px; gap:8px; align-items:center; position:sticky; top:0; z-index:5; margin:0 -32px 14px -24px; padding:14px 32px 12px 24px; background:var(--paper-2); border-bottom:1px solid var(--rule); }
  .top .brand { font-family:'Noto Serif TC', serif; font-weight:700; letter-spacing:.04em; margin-right:auto; white-space:nowrap; }
  .top .pgrp { display:flex; gap:8px; flex:1 1 22em; min-width:0; }
  .top .pgrp input { flex:1 1 8em; min-width:6em; width:auto; }
  .top .pgrp select { flex:0 1 auto; min-width:0; }
  .top .icons { display:flex; gap:8px; flex:none; }
  /* narrow reader (chat open, small window): brand and icons share the first row, the passage controls take the second */
  #reader { container-type:inline-size; }
  @container (max-width: 860px) {
    .top .pgrp { order:9; flex-basis:100%; }
    .top .icons { margin-left:auto; }
    .top .brand { margin-right:0; }
  }
  @container (max-width: 560px) { .top .brand { display:none; } }
  .page { position:relative; background:var(--card); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); padding:22px 28px 28px 78px; min-height:60vh; }
  .page::before { content:""; position:absolute; top:0; bottom:0; left:60px; width:1px; background:var(--margin); }   /* the red margin line */
  h1 { font-family:'Noto Serif TC', serif; font-size:1.05rem; font-weight:600; color:var(--ink-2); margin:0 0 14px; }
  .verse { position:relative; font-family:var(--serif); font-size:1.15rem; line-height:2.1; padding:6px 0; }
  .verse.has-notes { padding-bottom:78px; }
  .verse .n { position:absolute; left:-52px; top:6px; width:32px; text-align:right; font-family:var(--hand); font-size:.8rem; color:var(--margin); line-height:2.1; }
  .ann { --ann-font:var(--hand); cursor:pointer; }
  .chips { line-height:1.4; margin-top:2px; font-family:var(--hand); }
  .verse.has-notes .chips { margin-top:72px; }
  .verse.has-notes:has(.chips) { padding-bottom:8px; }
  /* AI note in flight: a dashed chip in the verse's own chip row, where the note will land; red with actions on failure */
  .chip.pending, .chip.err { display:inline-flex; align-items:center; gap:5px; cursor:default; opacity:1; }
  .chip.pending { --c:var(--ink-2); border-style:dashed; }
  .chip.pending .spin { width:10px; height:10px; border-width:1.5px; }
  .chip.pending .t { font-variant-numeric:tabular-nums; opacity:.7; }
  .chip.err { --c:#c45a38; }
  .chip.err button { font-size:.75rem; padding:0 5px; border-color:transparent; background:transparent; color:inherit; }
  .chip.err button:hover { text-decoration:underline; }
  .fns { margin-top:28px; padding-top:12px; border-top:1px solid var(--rule); font-family:var(--serif); font-size:.9rem; color:var(--ink-2); }
  .fns h3 { margin:0 0 6px; font-size:.8rem; font-weight:500; letter-spacing:.12em; }
  .fns ol { margin:0; padding-left:1.8em; } .fns li { line-height:1.8; padding:0 4px; border-radius:4px; transition:background 1.5s; }
  .fns li.flash { background:var(--paper-2); transition:none; }
  .verse { transition:background 1.5s; border-radius:4px; } .verse.flash { background:var(--paper-2); transition:none; }  /* ↩ from a footnote lights the verse briefly */
  .fns .v { font-family:var(--hand); color:var(--margin); margin-right:6px; } .fns .back { margin-left:6px; color:var(--pen); text-decoration:none; }
  .fn { font-size:.6em; vertical-align:super; color:var(--pen); cursor:pointer; user-select:none; margin:0 1px; font-family:var(--sans); }  /* translator footnote marker */
  .chip { display:inline-block; font-size:.8rem; padding:1px 8px; margin:2px 4px 0 0; border:1px solid var(--c); color:var(--c); border-radius:999px; cursor:pointer; opacity:.85; background:var(--paper); }

  /* note card popover */
  #detail { position:fixed; margin:0; inset:auto; width:min(440px, 90vw); max-height:45vh; overflow:auto; padding:12px 14px; border:1px solid var(--rule); border-radius:10px; background:var(--card); color:var(--ink); box-shadow:var(--shadow); font-size:.9rem; line-height:1.6; }
  #detail::backdrop { background:transparent; }
  /* note card: title on its own line, a quiet row of tags, the body, then text-style actions in a footer */
  #detail .hd { display:flex; align-items:flex-start; gap:8px; }
  #detail .hd b { font-family:var(--hand); font-weight:500; font-size:1.15rem; line-height:1.35; }
  #detail .dot { width:10px; height:10px; border-radius:50%; background:var(--c); flex:none; margin-top:.45em; }
  #detail .meta { display:flex; flex-wrap:wrap; gap:4px 6px; margin:4px 0 8px 18px; font-size:.75rem; color:var(--ink-2); }
  #detail .meta .tag { border:1px solid var(--rule); border-radius:999px; padding:0 7px; line-height:1.5; }
  #detail .meta .tag.unv { color:#b8751a; border-color:#b8751a; cursor:help; }
  #detail .body { margin-left:18px; }
  #detail .body > :first-child { margin-top:0; } #detail .body > :last-child { margin-bottom:0; }
  #detail .ft { display:flex; gap:2px; margin-top:10px; padding-top:8px; border-top:1px solid var(--rule); }
  #detail .ft button { font-size:.8rem; padding:3px 10px; border-color:transparent; background:transparent; color:var(--ink-2); }
  #detail .ft button:hover { color:var(--pen); background:var(--paper-2); }
  #detail .ft button.danger:hover { color:#c45a38; }
  #detail .ft #ask { margin-left:auto; color:var(--pen); }
  #detail .ed .cap { font-size:.75rem; color:var(--ink-2); }
  #detail .hd, #detail .ed .cap { cursor:move; user-select:none; touch-action:none; }  /* drag handles */
  /* inline editor: same card, fields stacked */
  #detail form.ed { display:grid; gap:6px; }
  #detail form.ed input, #detail form.ed textarea, #detail form.ed select { width:100%; box-sizing:border-box; }
  #detail form.ed textarea { min-height:80px; resize:vertical; font-family:var(--sans); }
  #detail form.ed .row { display:flex; gap:6px; justify-content:flex-end; }
  #detail form.ed .row select { width:auto; margin-right:auto; }
  /* selection menu: sits just under the highlighted text */
  #selmenu { position:fixed; margin:0; inset:auto; padding:4px; gap:4px; border:1px solid var(--rule); border-radius:8px; background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
  #selmenu:popover-open { display:flex; }
  #selmenu button { font-size:.85rem; padding:4px 10px; }
  /* loading states: a banner on the page for passage/quick-notes waits, a pending bubble for agent turns */
  /* status pill sits in the fixed-height heading row, so showing/hiding it never shifts the verses */
  .hrow { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin:0 0 8px; }
  .hrow h1 { margin:0; }
  /* tools row: action pills left, status pill right; wraps on a narrow reader, fixed min-height so the pill's coming and going never shifts the verses */
  .trow { display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; min-height:34px; margin:0 0 14px; }
  /* passage actions: one group of identical pills at the right of the heading row */
  .actions { display:inline-flex; flex-wrap:wrap; gap:6px; }
  .actions button { font-size:.82rem; padding:4px 12px; border-radius:999px; background:var(--paper-2); }
  .actions button:hover { background:var(--card); }
  /* the ELI5 button while its pass runs: same dashed, muted look as a pending chip, with a spinner in front of the label */
  .actions button.busy, .actions button.busy:hover { border-style:dashed; color:var(--ink-2); background:var(--paper-2); opacity:1; cursor:progress; }
  .actions button.busy::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; border:1.5px solid var(--rule); border-top-color:var(--pen); border-radius:50%; animation:spin .8s linear infinite; }
  .actions #quickClear:hover { border-color:#c45a38; color:#c45a38; }
  #quickClear[hidden] { display:none; }
  .actions + #banner { margin-left:0; }

  /* the pill can never widen the row: it shrinks and clips, the full text lives in its title tooltip */
  #banner { min-width:0; max-width:100%; }
  #banner { margin-left:auto; display:inline-flex; align-items:center; gap:8px; padding:4px 12px; border-radius:999px; background:var(--paper-2); border:1px solid var(--rule); color:var(--ink); font-size:.82rem; white-space:nowrap; }
  #banner[hidden] { display:none; }                     /* the display rule above would otherwise beat the hidden attribute */
  #bannerText { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #banner .t { flex:none; font-variant-numeric:tabular-nums; color:var(--ink-2); }
  .spin { width:14px; height:14px; border:2px solid var(--rule); border-top-color:var(--pen); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .dots { display:inline-flex; align-items:center; gap:4px; }  /* a flex box, not baseline-aligned inline boxes, so the dots sit on the text's centre line */
  .dots span { display:block; width:6px; height:6px; border-radius:50%; background:var(--pen); animation:blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay:.2s; } .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
  #log .msg.pending { border-color:var(--pen); }
  #log .msg.pending .act { display:flex; align-items:center; gap:10px; color:var(--ink-2); font-size:.85rem; }
  #log .msg.pending .act .t { margin-left:auto; font-variant-numeric:tabular-nums; }
  #status { padding:4px 12px; font-size:.8rem; color:var(--ink-2); font-family:var(--sans); min-height:1.6em; }
  form#f button.stop { background:#c45a38; border-color:#c45a38; color:#fff; }
  @media (prefers-reduced-motion: reduce) { .spin, .dots span { animation:none; } }
  #detail p { margin:.4em 0; }

  /* chat = sticky notes column */
  #chat { position:relative; min-width:0; border-left:1px solid var(--rule); background:var(--paper-2); display:flex; flex-direction:column; }
  #log { min-height:0; }   /* flex children only scroll when allowed to shrink below content height */
  #chat .chead { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--rule); font-size:.82rem; color:var(--ink-2); }
  #chat .chead button { font-size:.78rem; padding:2px 10px; }
  #log { flex:1; overflow:auto; padding:12px; font-size:.9rem; }
  #log:empty { flex:0; padding:0; }                       /* an empty log yields the space to the guide */
  #guide { flex:1; overflow:auto; padding:16px 14px; font-size:.86rem; color:var(--ink-2); line-height:1.6; }
  #guide[hidden] { display:none; } #guide p { margin:0 0 10px; } #guide b { color:var(--ink); }
  #guide .ex { display:flex; flex-wrap:wrap; gap:6px; } #guide .ex button { font-size:.8rem; padding:3px 10px; border-radius:999px; }
  #guide small { display:block; margin-top:4px; }
  #log .msg { background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:8px 12px; margin:.5em 0; box-shadow:0 1px 3px #0001; }
  #log details.steps { margin:.2em 0 .2em 6px; }
  #log details.steps summary { cursor:pointer; color:var(--ink-2); font-size:.76rem; list-style:none; }
  #log details.steps summary::before { content:'▸ '; } #log details.steps[open] summary::before { content:'▾ '; }
  /* the user's own message: keeps its line breaks; a long one folds to its first line */
  #log .msg.me .body { white-space:pre-wrap; }
  #log .msg.me.fold .body { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  #log .msg.me .more { border:none; background:transparent; color:var(--pen); font-size:.78rem; padding:2px 0 0; }
  #log .tool { color:var(--ink-2); font-size:.74rem; font-family:ui-monospace, monospace; padding:1px 6px; }
  #log .opts button { display:block; width:100%; margin:4px 0; text-align:left; }
  form#f { display:flex; gap:6px; padding:10px; border-top:1px solid var(--rule); }
  form#f input { flex:1; }
</style>
</head>
<body>
<section id="reader">
  <form id="pf" class="top"><span class="brand">Bible Buddy ELI5</span><div class="pgrp"><input id="pref" value="以賽亞書 7:10-17"><select id="pver"><option value="rcuv">和合本修訂版</option><option value="lcc">呂振中</option><option value="bhs">BHS 希伯來文</option><option value="fhlwh">NT 希臘文</option></select><button class="primary" id="pload">載入</button></div><div class="icons"><button type="button" id="theme" title="切換深淺色">☾</button><button type="button" id="chatToggle" title="顯示 / 隱藏 agent 對話">💬</button></div></form>
  <div id="page" class="page">
    <div class="hrow"><h1 id="ref">載入中…</h1></div>
    <div class="trow"><div class="actions"><button type="button" id="quick" title="一次模型掃整段，寫成淺顯易懂的 ELI5 筆記；產生過的段落直接回傳">✨ 生成 ELI5 筆記</button><button type="button" id="quickClear" hidden title="刪除這段所有自動筆記（ELI5、agent 標注、references）；手動筆記保留">🗑 清除自動筆記</button></div><div id="banner" hidden><span class="spin"></span><span id="bannerText"></span><span class="t" id="bannerTime"></span></div></div>
    <div id="verses"></div>
  </div>
  <div id="detail" popover></div>
  <div id="selmenu" popover><button type="button" id="selManual">✎ 手動筆記</button><button type="button" id="selAi" title="用模型針對這幾個字寫一條淺顯易懂的筆記">✨ ELI5 筆記</button></div>
</section>
<aside id="chat">
  <div id="gutter" title="拖曳調整寬度"></div>
  <div class="chead"><span>agent 對話</span><button type="button" id="clear" title="清空對話並重新開始 agent session">清除</button></div>
  <div id="log"></div>
  <div id="guide">
    <p><b>agent 可以做什麼</b></p>
    <p>問這段經文的任何問題，agent 會依 bible-buddy 流程查原文、背景與資料來源，並把關鍵發現標在左邊的經文上。</p>
    <p class="ex"><button type="button" data-q="第 1 節逐字原文分析">第 1 節逐字原文分析</button><button type="button" data-q="這段的第一世紀歷史處境">第一世紀歷史處境</button><button type="button" data-q="這段常見的誤讀與翻譯偏差">常見誤讀與翻譯偏差</button><button type="button" data-q="這段的相關經文與引用脈絡">相關經文</button></p>
    <p><b>其他入口</b></p>
    <p>反白經文 → 手動筆記或 ELI5 筆記。<br>✨ 生成 ELI5 筆記：一次掃整段，寫成淺顯易懂的筆記；「未驗證」的可從卡片請 agent 驗證。<br>對話會保留到你按「清除」；換段經文會重新開始。</p>
  </div>
  <div id="status" class="tool"></div>
  <form id="f"><input id="q" placeholder="例：以賽亞書 7:14 原文分析" autocomplete="off"><button class="primary" id="send">送出</button></form>
</aside>
<script type="module">
import { slotText } from 'https://cdn.jsdelivr.net/npm/slot-text@0.3.4/dist/index.js';
// slot-text everywhere text changes: headings, buttons, loading states. One instance per element.
const SLOTS = new Map();
function slot(target, initial) {
  const el = typeof target === 'string' ? document.querySelector(target) : target;
  if (!SLOTS.has(el)) { const t = initial ?? el.textContent.trim(); el.textContent = ''; SLOTS.set(el, slotText(el, t)); }
  return SLOTS.get(el);
}
// elapsed-seconds ticker into a slot; returns stop()
function ticker(target) {
  const t0 = Date.now(), s = slot(target, '0s');
  const id = setInterval(() => { const n = Math.round((Date.now() - t0) / 1000); s.set(n < 60 ? `${n}s` : `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`, { stagger: 0 }); }, 1000);
  return () => clearInterval(id);
}
let bannerStop = null, bannerHide = null;
function banner(text, { spin = true, timer = false, hideAfter = 0 } = {}) {
  bannerStop?.(); bannerStop = null; clearTimeout(bannerHide);  // a stale hideAfter must not wipe a newer error
  bannerHide = null;
  const b = $('#banner'); b.hidden = !text; if (!text) return;
  b.querySelector('.spin').style.display = spin ? '' : 'none';
  slot('#bannerText').set(text, { stagger: 20 });
  if (timer) bannerStop = ticker('#bannerTime'); else slot('#bannerTime', '').set('');
  if (hideAfter) bannerHide = setTimeout(() => banner(null), hideAfter);
}
const MAX_ARROWS = 3, MIN_GAP = 9;
const COLOR = { lexical:'amber', history:'blue', misread:'red', crossref:'purple', personal:'green' };
let verses = [], notes = [], cardSlot = null, lastRef = null, fnNum = {};
const TOOL_ZH = { Bash:'執行抓經文腳本', WebSearch:'搜尋', WebFetch:'讀網頁', Read:'讀參考資料', Grep:'查參考資料', Glob:'找檔案', Write:'寫檔案', Edit:'修改檔案', Skill:'載入 skill', ToolSearch:'找工具', mcp__notes__add_annotation:'加筆記', mcp__notes__update_annotation:'更新筆記' };
const DOTC = { amber:'#b8751a', blue:'#3b72c4', green:'#2f8f5b', red:'#c45a38', purple:'#8657c8' };
const $ = s => document.querySelector(s);

// 「以賽亞書 7:10-17」「創世記 1」「Matt 5:17」「約翰福音」（= 第 1 章）都吃
async function loadPassage(refStr, version) {
  const m = (refStr || '').trim().match(/^(\S+?)\s*(\d+)?(?::(\d+)(?:-(\d+))?)?$/);
  if (!m || /^\d/.test(m[1])) { banner('✗ 看不懂的經文位置，例：約翰福音 3:16', { spin: false, hideAfter: 4000 }); slot('#pload').set('載入'); return; }
  const qs = `?book=${encodeURIComponent(m[1])}&chapter=${m[2]||1}&start=${m[3]||1}&end=${m[4]||m[3]||200}&version=${version||'rcuv'}`;
  banner('載入經文…');
  const r = await (await fetch('/api/passage' + qs)).json();
  if (r.error) { banner(`✗ ${r.error}`, { spin: false, hideAfter: 4000 }); slot('#pload').set('載入'); return; }
  notes = await (await fetch('/api/notes')).json();   // server keeps them unless the passage changed
  verses = r.verses;
  const title = `${r.reference} · ${r.version}`;
  if (lastRef && lastRef !== r.reference) logLine('tool', `📖 切換到 ${esc(r.reference)}，agent 對話重新開始`);  // the server drops the agent session on a passage change
  lastRef = r.reference;
  slot('#ref').set(title); quickLabel();
  render();

function render() {
  let fnN = 0; fnNum = {}; const fnList = [];  // translator footnotes numbered once across the passage
  for (const v of verses) for (const [i, f] of (v.footnotes || []).entries()) { fnNum[`${v.verse}:${i}`] = ++fnN; fnList.push({ n: fnN, verse: v.verse, text: f.text }); }
  $('#verses').innerHTML = verses.map(v => {
    const vs = notes.filter(n => n.verse === v.verse && n.anchor).sort((a,b) => a.anchor.start - b.anchor.start);
    let out = '', pos = 0, shown = 0, lastStart = -99;
    const rest = notes.filter(n => n.verse === v.verse && !n.anchor);
    for (const n of vs) {
      // one arrow per ~9 chars and at most 3 per verse, so labels don't pile up; the rest become chips
      if (n.anchor.start < pos || shown >= MAX_ARROWS || n.anchor.start - lastStart < MIN_GAP) { rest.push(n); continue; }
      out += seg(v, pos, n.anchor.start);
      out += `<span class="ann ${n.anchor.start === 0 ? 'ann-nw' : 'ann-n'} ann-${COLOR[n.kind]||'amber'}" data-note="${esc(n.label)}" data-id="${n.id}">${seg(v, n.anchor.start, n.anchor.end)}</span>`;
      pos = n.anchor.end; shown++; lastStart = n.anchor.start;
    }
    out += seg(v, pos, v.text.length);
    const pend = [...pending.values()].filter(p => p.verse === v.verse);
    const chips = rest.length || pend.length ? `<div class="chips">${rest.map(n => `<span class="chip" data-id="${n.id}" style="--c:${DOTC[COLOR[n.kind]]}">${esc(n.label)}</span>`).join('')}${pend.map(pendingChip).join('')}</div>` : '';
    return `<div class="verse ${shown ? 'has-notes' : ''}" data-verse="${v.verse}"><span class="n">${v.verse}</span>${out}<span class="eol">\u200b</span>${chips}</div>`;
  }).join('') + (fnList.length ? `<section class="fns"><h3>譯註</h3><ol>${fnList.map(f => `<li id="fn-${f.n}"><span class="v">${f.verse}</span>${esc(f.text)}<a class="back" href="#fnref-${f.n}" title="回到經文">↩</a></li>`).join('')}</ol></section>` : '');

// a slice of the verse text with its footnote markers dropped in at their offsets (the text itself is already clean)
function seg(v, a, b) {
  let out = '', p = a;

    if (f.pos < a || f.pos > b || (f.pos === b && b !== v.text.length)) continue;

// After layout, turn those into chips. Re-run on resize since wrapping changes.
function demoteWrapped() {
  for (const vEl of document.querySelectorAll('.verse.has-notes')) {
    const lastTop = vEl.querySelector('.eol').getBoundingClientRect().top;
    for (const a of [...vEl.querySelectorAll('.ann')]) {
      const r = a.getBoundingClientRect();
      if (r.bottom >= lastTop) {                                        // on the last line: keep the arrow
        if (r.left - vEl.getBoundingClientRect().left < 110) a.classList.replace('ann-n', 'ann-nw');  // near left edge: lean right
        continue;
      }
      const n = notes.find(x => x.id === a.dataset.id);
      let chips = vEl.querySelector('.chips');
      if (!chips) { chips = document.createElement('div'); chips.className = 'chips'; vEl.appendChild(chips); }
      chips.insertAdjacentHTML('afterbegin', `<span class="chip" data-id="${n.id}" style="--c:${DOTC[COLOR[n.kind]]}">${esc(n.label)}</span>`);

  if (!s.running) return;
  chatOpen(true); setRunning(true);
  const cur = logLine('msg pending', `<div class="act"><span class="dots"><span></span><span></span><span></span></span><span class="a"></span><span class="t"></span></div>`);
  const act = slot(cur.querySelector('.a'), '接回進行中的回答…'); stopTick = ticker(cur.querySelector('.t'));
  stepSink = makeSteps(cur);
  slot('#status').set('⚙ agent 處理中（接回）…');
  let buf = '';
  const finish = () => { stopTick?.(); stopTick = null; cur.classList.remove('pending'); cur.querySelector('.act')?.remove(); setRunning(false); saveLog(); };
  await consume(await fetch('/api/chat/stream'), cur, act, finish, b => buf = b, () => buf);
}
// reads one SSE stream of turn events into a bubble; shared by a fresh turn and a reattached one
async function consume(res, cur, act, finish, setBuf, getBuf) {
  let finished = false; const end = () => { finished = true; finish(); };  // not `done`: the reader's { value, done } shadows it below
  const rd = res.body.getReader(), dec = new TextDecoder(); let rest = '';
  while (true) {
    const { value, done } = await rd.read(); if (done) break;
    rest += dec.decode(value, { stream:true });
    let i; while ((i = rest.indexOf('\n\n')) >= 0) {
      const line = rest.slice(0, i); rest = rest.slice(i + 2);
      if (!line.startsWith('data: ')) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === 'text') { setBuf(getBuf() + ev.text + '\n'); const a = cur.querySelector('.act'); cur.innerHTML = marked.parse(getBuf()); if (a) cur.prepend(a); slot('#status').set('✍ 撰寫中…'); act.set('撰寫中…'); }
      else if (ev.type === 'tool') { const z = TOOL_ZH[ev.name] || ev.name; slot('#status').set(`⚙ ${z}…`); act.set(`${z}…`); stepSink(`⚙ ${esc(ev.name)} ${esc(ev.input)}`); }
      else if (ev.type === 'note') { const i = notes.findIndex(x => x.id === ev.note.id); if (i >= 0) notes[i] = ev.note; else notes.push(ev.note); render(); }
      else if (ev.type === 'done') { end(); slot('#status').set(`✓ 完成 · ${ev.turns} turns`); slot('#send').flash('完成 ✓'); logLine('tool', `✓ ${ev.turns} turns${ev.is_error ? ' · ERROR' : ''}`); renderOptions(getBuf()); }
      else if (ev.type === 'error') { end(); slot('#status').set('✗ 出錯'); logLine('tool', `✗ ${esc(ev.text)}`); }
      $('#log').scrollTop = 1e9;
    }
  }
  if (!finished) { end(); slot('#status').set('✗ 連線中斷，重新整理可接回進行中的回答'); logLine('tool', '✗ 串流在 done 之前結束（server 重啟？）'); }
}
// 「請選擇 (1-N)」→ 按鈕
function renderOptions(text) {
  if (!/請選擇\s*\(1-\d\)/.test(text)) return;
  const opts = [...text.matchAll(/^\s*(\d)[\.、．]\s*(.+)$/gm)].slice(-6);
  if (!opts.length) return;
  const d = logLine('opts', '');
  for (const [, n, t] of opts) { const b = document.createElement('button'); b.textContent = `${n}. ${t.slice(0,60)}`; b.onclick = () => send(n); d.appendChild(b); }
}
// guide fills the panel until the first message; example buttons only fill the input
new MutationObserver(() => $('#guide').hidden = $('#log').children.length > 0).observe($('#log'), { childList: true });
$('#guide').hidden = $('#log').children.length > 0;
$('#guide').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { $('#q').value = b.dataset.q; $('#q').focus(); } });
$('#clear').onclick = () => { if (running) return; $('#log').innerHTML = ''; saveLog(); slot('#status').set(''); fetch('/api/chat/reset', { method: 'POST' }); };
$('#f').onsubmit = e => {
  e.preventDefault();
  if (running) { slot('#status').set('⏹ 停止中…'); fetch('/api/chat/stop', { method: 'POST' }); return; }
  const t = $('#q').value.trim(); if (!t) return; $('#q').value = ''; send(t);
};
$('#quick').onclick = runQuick;
// the button itself says whether this passage already has its ELI5 pass
function quickLabel() { slot('#quick').set(notes.some(x => x.author === 'quick') ? '✨ ELI5 筆記 ✓' : '✨ 生成 ELI5 筆記'); $('#quickClear').hidden = !notes.some(x => x.author !== 'user'); }
// delete every automatic note of the passage (ELI5, agent, references) after a native confirm
$('#quickClear').onclick = async () => {
  const n = notes.filter(x => x.author !== 'user').length;
  if (!confirm(`確定刪除這段全部 ${n} 條自動筆記（ELI5、agent 標注、references）？\n手動筆記會保留。這個動作無法復原。`)) return;
  const r = await api('/api/notes/quick', 'DELETE');
  notes = notes.filter(x => x.author === 'user'); render(); quickLabel();
  banner(`✓ 已刪除 ${r.removed} 條自動筆記`, { spin: false, hideAfter: 3000 });
};
$('#pf').onsubmit = async e => {
  e.preventDefault(); slot('#pload').set('載入中…');
  try { localStorage.setItem('passage', JSON.stringify({ ref: $('#pref').value.trim(), version: $('#pver').value })); } catch {}
  await loadPassage($('#pref').value.trim(), $('#pver').value);
};
// chat panel: closed by default; the 💬 button toggles it, the gutter resizes it, both remembered
function chatOpen(on) { document.body.classList.toggle('chat-hidden', !on); $('#chatToggle').classList.toggle('on', on); try { localStorage.setItem('chat', on ? '1' : '0'); } catch {} }
let chatPref = '0', chatW = 0; try { chatPref = localStorage.getItem('chat') ?? '0'; chatW = +localStorage.getItem('chatW'); } catch {}
chatOpen(chatPref === '1');
if (chatW) document.body.style.setProperty('--chat-w', chatW + 'px');
$('#chatToggle').onclick = () => chatOpen(document.body.classList.contains('chat-hidden'));
$('#gutter').addEventListener('pointerdown', e => {
  const g = e.currentTarget; g.setPointerCapture(e.pointerId); g.classList.add('on');
  const move = ev => document.body.style.setProperty('--chat-w', Math.max(280, Math.min(innerWidth * .7, innerWidth - ev.clientX)) + 'px');
  g.addEventListener('pointermove', move);
  g.addEventListener('pointerup', () => { g.removeEventListener('pointermove', move); g.classList.remove('on'); try { localStorage.setItem('chatW', parseInt(document.body.style.getPropertyValue('--chat-w'))); } catch {} render(); }, { once: true });
  e.preventDefault();
});
// theme: explicit data-theme, light by default, remembered per browser
const root = document.documentElement;
try { root.dataset.theme = localStorage.getItem('theme') || 'light'; } catch {}
const paintTheme = () => slot('#theme').set(root.dataset.theme === 'dark' ? '☀' : '☾');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('theme', root.dataset.theme); } catch {} paintTheme(); };
paintTheme();
slot('.brand', '').set('Bible Buddy ELI5', { stagger: 30 });
slot('#ref', '').set('載入中…');
slot('#pload'); slot('#send'); slot('#status', '');
// a refresh must come back to the same passage, or it would switch the server's passage and drop the running quick pass
let saved = null; try { saved = JSON.parse(localStorage.getItem('passage')); } catch {}
if (saved?.ref) { $('#pref').value = saved.ref; $('#pver').value = saved.version || 'rcuv'; }
loadPassage(saved?.ref, saved?.version).then(reattach);
</script>
