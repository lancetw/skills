<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<title>Bible Buddy Web — PROTOTYPE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/syabro/neat-annotations/neat-annotations.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@500;600;700&family=Iansui&family=LXGW+WenKai+TC&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slot-text@0.3.4/style.css">
<style>
  /* notebook: ivory paper, red margin rule, serif scripture, handwritten labels. Light by default. */
  :root {
    /* handwriting stack: Shantell Sans covers Latin only, so CJK falls through to Iansui (芫荽), then 霞鶩文楷 */
    --hand: 'Shantell Sans', 'Iansui', 'LXGW WenKai TC', cursive;
    color-scheme: light;
    --paper:#F8F5EC; --paper-2:#F1EDE1; --ink:#2B2A26; --ink-2:#6E6A60; --rule:#DED8C8; --margin:#D9A3A3;
    --pen:#3A5A8C; --card:#FFFDF7; --shadow:0 6px 20px #4a412a22;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:#1E1D1A; --paper-2:#26241F; --ink:#E6E1D6; --ink-2:#A39E92; --rule:#36332C; --margin:#7A4A4A;
    --pen:#8FB0E0; --card:#2A2823; --shadow:0 6px 20px #00000066;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans TC', system-ui, sans-serif; display:grid; grid-template-columns:1fr 420px; height:100vh; }
  button, input, select { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--pen); color:var(--pen); }
  button.primary { background:var(--pen); color:var(--paper); border-color:var(--pen); }

  /* reader = a notebook page */
  #reader { overflow:auto; padding:20px 32px 40px 24px; }
  .top { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .top .brand { font-family:'Noto Serif TC', serif; font-weight:700; letter-spacing:.04em; margin-right:auto; }
  .top input { width:14em; }
  #page { position:relative; background:var(--card); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); padding:22px 28px 28px 78px; min-height:60vh; }
  #page::before { content:""; position:absolute; top:0; bottom:0; left:60px; width:1px; background:var(--margin); }   /* the red margin line */
  h1 { font-family:'Noto Serif TC', serif; font-size:1.05rem; font-weight:600; color:var(--ink-2); margin:0 0 14px; }
  .verse { position:relative; font-family:'Noto Serif TC', 'Songti TC', serif; font-size:1.15rem; line-height:2.1; padding:6px 0; }
  .verse.has-notes { padding-bottom:78px; }
  .verse .n { position:absolute; left:-52px; top:6px; width:32px; text-align:right; font-family:var(--hand); font-size:.8rem; color:var(--margin); line-height:2.1; }
  .ann { --ann-font:var(--hand); cursor:pointer; }
  .chips { line-height:1.4; margin-top:2px; font-family:var(--hand); }
  .verse.has-notes .chips { margin-top:72px; }
  .verse.has-notes:has(.chips) { padding-bottom:8px; }
  .chip { display:inline-block; font-size:.8rem; padding:1px 8px; margin:2px 4px 0 0; border:1px solid var(--c); color:var(--c); border-radius:999px; cursor:pointer; opacity:.85; background:var(--paper); }

  /* note card popover */
  #detail { position:fixed; margin:0; inset:auto; width:min(440px, 90vw); max-height:45vh; overflow:auto; padding:12px 14px; border:1px solid var(--rule); border-radius:10px; background:var(--card); color:var(--ink); box-shadow:var(--shadow); font-size:.9rem; line-height:1.6; }
  #detail::backdrop { background:transparent; }
  #detail .hd { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #detail .hd b { font-family:var(--hand); font-weight:500; font-size:1.05rem; }
  #detail .dot { width:10px; height:10px; border-radius:50%; background:var(--c); }
  #detail .hd small { color:var(--ink-2); }
  #detail .hd .unv { width:16px; height:16px; border-radius:50%; border:1px solid var(--ink-2); color:var(--ink-2); font-size:.7rem; line-height:14px; text-align:center; cursor:help; font-family:'Noto Sans TC', sans-serif; }
  #detail .hd button { margin-left:auto; font-size:.8rem; padding:2px 8px; }
  #detail p { margin:.4em 0; }

  /* chat = sticky notes column */
  #chat { border-left:1px solid var(--rule); background:var(--paper-2); display:flex; flex-direction:column; }
  .tabs { display:flex; gap:4px; padding:10px 12px 0; }
  .tabs button { border-radius:6px 6px 0 0; border-bottom:none; background:transparent; color:var(--ink-2); }
  .tabs button.on { background:var(--card); color:var(--ink); font-weight:700; }
  #log { flex:1; overflow:auto; padding:12px; font-size:.9rem; border-top:1px solid var(--rule); }
  #log .msg { background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:8px 12px; margin:.5em 0; box-shadow:0 1px 3px #0001; }
  #log .tool { color:var(--ink-2); font-size:.74rem; font-family:ui-monospace, monospace; padding:1px 6px; }
  #log .opts button { display:block; width:100%; margin:4px 0; text-align:left; }
  #study { display:none; padding:12px; overflow:auto; flex:1; font-size:.9rem; border-top:1px solid var(--rule); }
  #study blockquote { border-left:3px solid #b8751a; padding-left:10px; color:var(--ink-2); }
  #study .tool { font-size:.74rem; color:var(--ink-2); word-break:break-all; }
  form#f { display:flex; gap:6px; padding:10px; border-top:1px solid var(--rule); }
  form#f input { flex:1; }
</style>
</head>
<body>
<section id="reader">
  <form id="pf" class="top"><span class="brand">Bible Buddy 筆記本</span><input id="pref" value="以賽亞書 7:10-17"><select id="pver"><option value="rcuv">和合本修訂版</option><option value="lcc">呂振中</option><option value="bhs">BHS 希伯來文</option><option value="fhlwh">NT 希臘文</option></select><button class="primary" id="pload">載入</button><button type="button" id="theme" title="切換深淺色">☾</button></form>
  <div id="page">
    <h1 id="ref">載入中…</h1>
    <div id="verses"></div>
  </div>
  <div id="detail" popover></div>
</section>
<aside id="chat">
  <div class="tabs"><button class="on" data-tab="log">對話</button><button data-tab="study">研讀報告</button></div>
  <div id="log"></div>
  <div id="study"><select id="ssel" style="width:100%;margin-bottom:8px"></select><div id="sbody" class="tool">還沒有研讀報告。問 agent 一次完整研讀，報告會存到 ~/Desktop/bible-buddy/</div></div>
  <div id="status" class="tool"></div>
  <form id="f"><input id="q" placeholder="例：以賽亞書 7:14 原文分析" autocomplete="off"><button class="primary" id="send">送出</button></form>
</aside>
<script type="module">
import { slotText } from 'https://cdn.jsdelivr.net/npm/slot-text@0.3.4/dist/index.js';
// slot-text everywhere text changes: headings, buttons, loading states. One instance per element.
const SLOTS = new Map();
function slot(target, initial) {
  const el = typeof target === 'string' ? document.querySelector(target) : target;
  if (!SLOTS.has(el)) { const t = initial ?? el.textContent.trim(); el.textContent = ''; SLOTS.set(el, slotText(el, t)); }
  return SLOTS.get(el);
}
const MAX_ARROWS = 3, MIN_GAP = 9;
const COLOR = { lexical:'amber', history:'blue', misread:'red', crossref:'purple', personal:'green' };
let verses = [], notes = [], studyPath = null, cardSlot = null;
const TOOL_ZH = { Bash:'執行抓經文腳本', WebSearch:'搜尋', WebFetch:'讀網頁', Read:'讀參考資料', Grep:'查參考資料', Glob:'找檔案', Write:'寫研讀報告', Edit:'修改報告', Skill:'載入 skill', ToolSearch:'找工具', mcp__notes__add_annotation:'加筆記' };
const DOTC = { amber:'#b8751a', blue:'#3b72c4', green:'#2f8f5b', red:'#c45a38', purple:'#8657c8' };
const $ = s => document.querySelector(s);

// 「以賽亞書 7:10-17」「創世記 1」「Matt 5:17」都吃
async function loadPassage(refStr, version) {
  const m = (refStr || '').match(/^(\S+)\s+(\d+)(?::(\d+)(?:-(\d+))?)?$/);
  const qs = m ? `?book=${encodeURIComponent(m[1])}&chapter=${m[2]}&start=${m[3]||1}&end=${m[4]||m[3]||200}&version=${version||'rcuv'}` : '';
  const r = await (await fetch('/api/passage' + qs)).json();
  if (r.error) { alert(r.error); return; }
  notes = await (await fetch('/api/notes')).json();   // server keeps them unless the passage changed
  verses = r.verses;
  const title = `${r.reference} · ${r.version}`;
  slot('#ref').set(title);
  render();
  await addAuto('/api/auto-notes/refs');        // instant, from bible-buddy references
  slot('#ref').set(`${title}　⏳ 速讀筆記產生中…`);
  await addAuto('/api/auto-notes/quick');       // one cheap model pass, ~20 s
  slot('#ref').set(title);
}
async function addAuto(url) {
  const fresh = await (await fetch(url)).json();
  for (const n of fresh) if (!notes.some(x => x.id === n.id)) notes.push(n);
  render();
}

function render() {
  $('#verses').innerHTML = verses.map(v => {
    const vs = notes.filter(n => n.verse === v.verse && n.anchor).sort((a,b) => a.anchor.start - b.anchor.start);
    let out = '', pos = 0, shown = 0, lastStart = -99;
    const rest = notes.filter(n => n.verse === v.verse && !n.anchor);
    for (const n of vs) {
      // one arrow per ~9 chars and at most 3 per verse, so labels don't pile up; the rest become chips
      if (n.anchor.start < pos || shown >= MAX_ARROWS || n.anchor.start - lastStart < MIN_GAP) { rest.push(n); continue; }
      out += esc(v.text.slice(pos, n.anchor.start));
      out += `<span class="ann ${n.anchor.start === 0 ? 'ann-nw' : 'ann-n'} ann-${COLOR[n.kind]||'amber'}" data-note="${esc(n.label)}" data-id="${n.id}">${esc(v.text.slice(n.anchor.start, n.anchor.end))}</span>`;
      pos = n.anchor.end; shown++; lastStart = n.anchor.start;
    }
    out += esc(v.text.slice(pos));
    const chips = rest.length ? `<div class="chips">${rest.map(n => `<span class="chip" data-id="${n.id}" style="--c:${DOTC[COLOR[n.kind]]}">${esc(n.label)}</span>`).join('')}</div>` : '';
    return `<div class="verse ${shown ? 'has-notes' : ''}" data-verse="${v.verse}"><span class="n">${v.verse}</span>${out}<span class="eol">\u200b</span>${chips}</div>`;
  }).join('');
  demoteWrapped();
}
// Labels hang ~70px under their span, so an arrow on any line but the last would cover the next line.
// After layout, turn those into chips. Re-run on resize since wrapping changes.
function demoteWrapped() {
  for (const vEl of document.querySelectorAll('.verse.has-notes')) {
    const lastTop = vEl.querySelector('.eol').getBoundingClientRect().top;
    for (const a of [...vEl.querySelectorAll('.ann')]) {
      const r = a.getBoundingClientRect();
      if (r.bottom >= lastTop) {                                        // on the last line: keep the arrow
        if (r.left - vEl.getBoundingClientRect().left < 110) a.classList.replace('ann-n', 'ann-nw');  // near left edge: lean right
        continue;
      }
      const n = notes.find(x => x.id === a.dataset.id);
      let chips = vEl.querySelector('.chips');
      if (!chips) { chips = document.createElement('div'); chips.className = 'chips'; vEl.appendChild(chips); }
      chips.insertAdjacentHTML('afterbegin', `<span class="chip" data-id="${n.id}" style="--c:${DOTC[COLOR[n.kind]]}">${esc(n.label)}</span>`);
      a.replaceWith(document.createTextNode(a.textContent));
    }
    if (!vEl.querySelector('.ann')) vEl.classList.remove('has-notes');
  }
}
addEventListener('resize', render);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const AUTHOR = { agent:'agent 研讀', quick:'速讀', refs:'references', user:'我' };
$('#verses').addEventListener('click', e => {
  const a = e.target.closest('[data-id]'); if (!a) return;
  const n = notes.find(x => x.id === a.dataset.id);
  const d = $('#detail');
  d.innerHTML = `<div class="hd"><span class="dot" style="--c:${DOTC[COLOR[n.kind]]}"></span><b></b><small>${AUTHOR[n.author]||n.author} · ${n.kind}</small>${n.author === 'quick' ? '<span class="unv" title="速讀筆記，未經 bible-buddy 驗證流程">?</span>' : ''}<button id="ask">追問</button></div>${marked.parse((n.body || '（沒有內文）').replace(/\n*（速讀筆記，未經 bible-buddy 驗證流程）$/, ''))}`;
  cardSlot?.destroy(); cardSlot = slotText(d.querySelector('.hd b'), ''); cardSlot.set(n.label, { stagger: 25 });
  d.querySelector('#ask').onclick = () => { d.hidePopover(); $('#q').value = `針對「${n.label}」再深入：`; $('#q').focus(); };
  d.showPopover();
  // below the label (label sits ~70px under the span); flip above if it would overflow
  const r = a.getBoundingClientRect();
  let top = r.bottom + 78;
  if (top + d.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - d.offsetHeight - 8);
  d.style.top = top + 'px';
  d.style.left = Math.max(8, Math.min(r.left, innerWidth - d.offsetWidth - 8)) + 'px';
});

// 手動筆記：反白一節內的文字 → prompt 標籤
document.addEventListener('mouseup', async () => {
  const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
  const q = sel.toString().trim(); if (!q) return;
  const vEl = sel.anchorNode.parentElement.closest('.verse'); if (!vEl) return;
  const v = verses.find(x => x.verse === vEl.dataset.verse);
  const start = v.text.indexOf(q); if (start < 0) return;
  const label = window.prompt(`筆記標籤（≤20 字）：「${q}」`); if (!label) return;
  const note = await (await fetch('/api/notes', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ verse: v.verse, anchor:{start, end:start+q.length}, label: label.slice(0,20), body:'' }) })).json();
  notes.push(note); sel.removeAllRanges(); render();
});

function logLine(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; $('#log').appendChild(d); $('#log').scrollTop = 1e9; return d; }

async function send(text) {
  slot('#send').set('思考中…'); slot('#status').set('⚙ 送出中…');
  logLine('msg', `<b>你：</b>${esc(text)}`);
  const cur = logLine('msg', '');
  let buf = '';
  const res = await fetch('/api/chat', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ message:text }) });
  const rd = res.body.getReader(), dec = new TextDecoder(); let rest = '';
  while (true) {
    const { value, done } = await rd.read(); if (done) break;
    rest += dec.decode(value, { stream:true });
    let i; while ((i = rest.indexOf('\n\n')) >= 0) {
      const line = rest.slice(0, i); rest = rest.slice(i + 2);
      if (!line.startsWith('data: ')) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === 'text') { buf += ev.text + '\n'; cur.innerHTML = marked.parse(buf); slot('#status').set('✍ 撰寫中…'); }
      else if (ev.type === 'tool') { slot('#status').set(`⚙ ${TOOL_ZH[ev.name] || ev.name}…`); logLine('tool', `⚙ ${esc(ev.name)} ${esc(ev.input)}`); const m = ev.input.match(/file_path[^"]*"([^"]+\.md)"/); if (ev.name === 'Write' && m) studyPath = m[1]; }
      else if (ev.type === 'note') { notes.push(ev.note); render(); }
      else if (ev.type === 'done') { slot('#status').set(`✓ 完成 · ${ev.turns} turns · $${(ev.cost||0).toFixed(2)}`); slot('#send').set('送出'); slot('#send').flash('完成 ✓'); logLine('tool', `✓ ${ev.turns} turns · $${(ev.cost||0).toFixed(2)}${ev.is_error ? ' · ERROR' : ''}`); renderOptions(buf); if (studyPath) loadStudy(studyPath); }
      else if (ev.type === 'error') { slot('#status').set('✗ 出錯'); slot('#send').set('送出'); logLine('tool', `✗ ${esc(ev.text)}`); }
      $('#log').scrollTop = 1e9;
    }
  }
}
// 「請選擇 (1-N)」→ 按鈕
function renderOptions(text) {
  if (!/請選擇\s*\(1-\d\)/.test(text)) return;
  const opts = [...text.matchAll(/^\s*(\d)[\.、．]\s*(.+)$/gm)].slice(-6);
  if (!opts.length) return;
  const d = logLine('opts', '');
  for (const [, n, t] of opts) { const b = document.createElement('button'); b.textContent = `${n}. ${t.slice(0,60)}`; b.onclick = () => send(n); d.appendChild(b); }
}
// 研讀報告 tab lists every .md the skill has saved; newest first, or the one just written
async function loadStudy(path) {
  const list = await (await fetch('/api/studies')).json();
  $('#ssel').innerHTML = list.map(f => `<option value="${esc(f.path)}">${esc(f.name)}</option>`).join('');
  if (!list.length) return;
  $('#ssel').value = path && list.some(f => f.path === path) ? path : list[0].path;
  const md = await (await fetch('/api/study?path=' + encodeURIComponent($('#ssel').value))).text();
  $('#sbody').className = ''; $('#sbody').innerHTML = marked.parse(md.replace(/^---[\s\S]*?\n---\n/, ''));  // drop YAML frontmatter
  if (path) slot(tabStudy).flash('報告已生成', { revertAfter: 2500 });
}
$('#ssel').onchange = () => loadStudy($('#ssel').value);
const tabStudy = document.querySelector('.tabs button[data-tab="study"]');
document.querySelectorAll('.tabs button').forEach(b => slot(b));
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#log').style.display = b.dataset.tab === 'log' ? '' : 'none';
  $('#study').style.display = b.dataset.tab === 'study' ? 'block' : 'none';
  if (b.dataset.tab === 'study' && !$('#ssel').options.length) loadStudy();
});
$('#f').onsubmit = e => { e.preventDefault(); const t = $('#q').value.trim(); if (!t) return; $('#q').value = ''; send(t); };
$('#pf').onsubmit = async e => { e.preventDefault(); slot('#pload').set('載入中…'); await loadPassage($('#pref').value.trim(), $('#pver').value); slot('#pload').set('載入'); };
// theme: explicit data-theme, light by default, remembered per browser
const root = document.documentElement;
try { root.dataset.theme = localStorage.getItem('theme') || 'light'; } catch {}
const paintTheme = () => slot('#theme').set(root.dataset.theme === 'dark' ? '☀' : '☾');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('theme', root.dataset.theme); } catch {} paintTheme(); };
paintTheme();
slot('.brand', '').set('Bible Buddy 筆記本', { stagger: 30 });
slot('#ref', '').set('載入中…');
slot('#pload'); slot('#send'); slot('#status', '');
loadPassage();
</script>
</body>
</html>
