[project]
name = "lancetw-skills"
version = "0.1.0"
description = "Taiwan Traditional Chinese skills for AI coding agents"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "W293"]

[tool.ruff.lint.per-file-ignores]
# Text-Fabric's documented API handles are A (app), F (features), L (locality), TF (fabric)
"skills/bible/bible-buddy/scripts/fetch_{dss,lxx}.py" = ["N803", "N806"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101", "B110", "B404", "B603", "B607"]
